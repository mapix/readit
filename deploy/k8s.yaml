apiVersion: v1
kind: Namespace
metadata:
  name: readit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: readit
spec:
  replicas: 1
  selector:
    matchLabels: {app: readit-landing}
  template:
    metadata:
      labels: {app: readit-landing}
    spec:
      containers:
      - name: web
        image: readit-landing:initial
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 80}]
        readinessProbe: {httpGet: {path: /healthz, port: 80}}
        livenessProbe: {httpGet: {path: /healthz, port: 80}, initialDelaySeconds: 5}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: landing
  namespace: readit
spec:
  selector: {app: readit-landing}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: readit
  namespace: readit
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts: [readit.novarock.io]
    secretName: readit-tls
  rules:
  - host: readit.novarock.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: landing, port: {number: 80}}
